name: CPU CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.12 CPU tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install CPU PyTorch
        run: >-
          python -m pip install
          torch==2.5.1
          torchvision==0.20.1
          --index-url https://download.pytorch.org/whl/cpu

      - name: Install LegoNet and test dependencies
        run: python -m pip install -e ".[test]"

      - name: Verify package and public CLI
        run: |
          python -c "import legonet"
          legonet --help

      - name: Collect tests
        run: python -m pytest --collect-only -q

      - name: Run fast CPU tests
        run: python -m pytest -m "not slow and not gpu" --cov=legonet --cov-report=term-missing --cov-report=xml

      - name: Build distribution artifacts
        run: python -m build

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-3.12
          path: coverage.xml
          if-no-files-found: error
