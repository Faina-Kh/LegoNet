name: legonet

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.12
  - pip
  - pip:
      # CUDA 12.1 wheels matching the current newTorchEnv environment.
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - torch==2.5.1+cu121
      - torchvision==0.20.1+cu121
      - numpy==2.4.3
      - pillow==12.1.1
      - matplotlib==3.10.8
      - opencv-python==4.13.0.92
      - pycocotools==2.0.11
      - scikit-image==0.26.0
      - six==1.17.0
      - thop==0.1.1-2209072238
      # Required by apps/streamlit_app.py; it is not needed for core training.
      - streamlit>=1.40,<2
